<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Gesperrt – WebsiteTimeTrack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page block-page">
    <main class="block-card">
        <div class="block-icon" aria-hidden="true">⏳</div>
        <h1 id="headline">Pause</h1>
        <p id="reason" class="block-reason"></p>
        <p id="detail" class="block-detail"></p>

        <div class="block-actions">
            <button id="snooze" type="button" class="button">5 Minuten trotzdem</button>
            <button id="options" type="button" class="button ghost">Einstellungen</button>
        </div>
        <p id="note" class="block-note"></p>
    </main>

    <script type="module" src="blocked.js"></script>
</body>
</html>
